<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intern Check-in</title>
  <script src="api-config.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="scan-page">
  <div class="container">
    <h2>📷 Intern Check-in</h2>
    <p id="userInfo" style="color:#666; font-size:14px; margin-bottom:15px;"></p>

    <!-- Scanner (starts automatically) -->
    <div id="scanSection" style="margin-top:20px;">
      <div id="reader"></div>
      <div class="roomLabel" id="roomDisplay"></div>
    </div>
    <a href="login.html" class="back">&larr; Logout</a>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-icon">✅</div>
      <h3 class="modal-title">Success!</h3>
      <p class="modal-text">Check-in confirmed successfully.</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button class="modal-btn" onclick="goToDashboard()" style="background:#3498db;">📊 My Dashboard</button>
        <button class="modal-btn" onclick="closeModal()">OK</button>
      </div>
    </div>
  </div>
  <script>
    const ROOM_LAT = 13.90142;
    const ROOM_LNG = 100.53235;
    const MAX_DISTANCE = 50;

    let scannedRoom = null;
    let scanner = null;
    let studentData = { id: null, name: null };
    let isProcessing = false;

    // Load user data from localStorage (set during login)
    (function init() {
      const storedId = localStorage.getItem('user_id');
      const storedName = localStorage.getItem('user_name');

      if (!storedId || !storedName) {
        // Not logged in — redirect to login
        alert("กรุณาเข้าสู่ระบบก่อน (Please login first)");
        window.location.href = "login.html";
        return;
      }

      studentData.id = storedId;
      studentData.name = storedName;

      // Show who is scanning
      document.getElementById("userInfo").textContent = `👤 ${storedName} (${storedId})`;

      // Start scanner automatically
      scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      scanner.render(onScanSuccess);
    })();

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c * 1000;
    }

    function checkDuplicate() {
      let today = new Date().toDateString();
      let last = localStorage.getItem("checkin");
      if (last == today) {
        alert("วันนี้คุณเช็คชื่อไปแล้ว");
        return false;
      }
      return true;
    }

    const SECRET_KEY = "AttAppGps2026!";

    async function generateHash(data) {
      const msgUint8 = new TextEncoder().encode(data + SECRET_KEY);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      return hashHex;
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      // 1. Validate QR Code Signature
      let qrData;
      let isValid = false;
      let roomName = "";

      try {
        qrData = JSON.parse(decodedText);
        if (qrData.payload && qrData.payload.room && qrData.signature) {
          let payloadStr = `${qrData.payload.room}|${qrData.payload.timestamp}`;
          let expectedSignature = await generateHash(payloadStr);

          if (expectedSignature === qrData.signature) {
            isValid = true;
            roomName = qrData.payload.room;
          }
        }
      } catch (e) {
        // Not JSON or other error
      }

      if (!isValid) {
        document.getElementById("roomDisplay").innerHTML = "<br><br><span style='color:red; font-size: 18px; font-weight: bold;'>Invalid QR Code / This is not a valid work check-in code</span>";
        setTimeout(() => {
          document.getElementById("roomDisplay").innerText = "";
          isProcessing = false;
        }, 3000);
        return;
      }

      // 2. Geolocation Check
      if (navigator.geolocation) {
        document.getElementById("roomDisplay").innerHTML = "<span style='color:#f39c12;'>กำลังตรวจสอบตำแหน่ง...</span>";

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            const distance = getDistance(ROOM_LAT, ROOM_LNG, userLat, userLng);

            if (distance <= MAX_DISTANCE) {
              processScan(roomName);
            } else {
              document.getElementById("roomDisplay").innerHTML = "<br><br><span style='color:red; font-size: 18px; font-weight: bold;'>อยู่นอกพื้นที่ ไม่สามารถลงเวลาได้</span>";
              isProcessing = false;
            }
          },
          (error) => {
            let errorMsg = "ไม่สามารถดึงข้อมูลตำแหน่งได้";
            if (error.code === error.PERMISSION_DENIED) {
              errorMsg = "กรุณาอนุญาตการเข้าถึงตำแหน่ง (Location/GPS)";
            }
            document.getElementById("roomDisplay").innerHTML = `<br><br><span style='color:red; font-size: 18px; font-weight: bold;'>${errorMsg}</span>`;
            isProcessing = false;
          },
          { enableHighAccuracy: true }
        );
      } else {
        alert("เบราว์เซอร์ของคุณไม่รองรับ Geolocation");
        isProcessing = false;
      }
    }

    function formatTime(date) {
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}`;
    }

    function formatDate(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function calculateStatus(checkInDate) {
      const hour = checkInDate.getHours();
      const minute = checkInDate.getMinutes();
      const timeInMinutes = hour * 60 + minute;
      const workStartTime = 8 * 60; // 08:00

      if (timeInMinutes <= workStartTime) {
        return { status: 'on-time', lateTime: '-' };
      } else {
        const lateMinutes = timeInMinutes - workStartTime;
        const h = Math.floor(lateMinutes / 60);
        const m = lateMinutes % 60;
        let lateTimeStr = '';
        if (h > 0) lateTimeStr += h + 'h';
        if (m > 0) lateTimeStr += (lateTimeStr ? ' ' : '') + m + 'm';
        return { status: 'late', lateTime: lateTimeStr };
      }
    }

    function processScan(roomName) {
      scannedRoom = roomName;

      scanner.clear();
      document.getElementById("roomDisplay").innerHTML = "Room : <span style='color:#2ecc71;'>" + scannedRoom + "</span><br><br><span style='color:#3498db;font-weight:bold;'>กำลังบันทึกข้อมูล...</span>";

      const now = new Date();
      const statusInfo = calculateStatus(now);

      let data = {
        date: formatDate(now),
        student_id: studentData.id,
        name: studentData.name,
        room: scannedRoom,
        check_in: formatTime(now),
        check_out: '-',
        status: statusInfo.status,
        late_time: statusInfo.lateTime
      };

      const apiUrl = typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : '';

      fetch(apiUrl, {
        method: "POST",
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(data)
      }).then(() => {
        // Update text to show success
        document.getElementById("roomDisplay").innerHTML = "Room : <span style='color:#2ecc71;'>" + scannedRoom + "</span><br><br><span style='color:#2ecc71;font-weight:bold;'>✅ บันทึกข้อมูลสำเร็จ</span>";
        // Show success modal
        document.getElementById("successModal").style.display = "flex";
      }).catch((err) => {
        alert("เกิดข้อผิดพลาดในการบันทึก");
        isProcessing = false;
        document.getElementById("roomDisplay").innerHTML = `<span style='color:red;'>Error saving data. Please refresh to try again.</span>`;
      });
    }

    // Go to student's personal dashboard
    function goToDashboard() {
      document.getElementById("successModal").style.display = "none";
      window.location.href = `UserDashBoard.htm?student_id=${encodeURIComponent(studentData.id)}&name=${encodeURIComponent(studentData.name)}`;
    }

    // Modal Close logic — just dismiss the popup
    function closeModal() {
      document.getElementById("successModal").style.display = "none";
    }
  </script>
</body>

</html>
