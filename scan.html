<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Intern Check-in</title>

<script src="api-config.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family:Arial;
background:#f4f6f9;
text-align:center;
padding:30px;
}

.container{
background:white;
padding:25px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
padding:12px;
width:100%;
background:#2ecc71;
color:white;
border:none;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

#reader{
width:300px;
margin:auto;
}

#formSection{
display:none;
}

.roomLabel{
font-weight:bold;
margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>Intern Check-in</h2>

<div id="reader"></div>

<div class="roomLabel" id="roomDisplay"></div>

<div id="formSection">

Student ID
<input id="student_id">

Name
<input id="name">

<button onclick="checkin()">Check-in</button>

</div>

</div>

<script>

const ROOM_LAT = 13.901234
const ROOM_LNG = 100.532456
const MAX_DISTANCE = 50

let scannedRoom = null
let scanner = null

function getDistance(lat1, lon1, lat2, lon2){

const R = 6371

const dLat = (lat2-lat1) * Math.PI/180
const dLon = (lon2-lon1) * Math.PI/180

const a =
Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2) * Math.sin(dLon/2)

const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c*1000

}

function checkDuplicate(){

let today = new Date().toDateString()
let last = localStorage.getItem("checkin")

if(last == today){

alert("วันนี้คุณเช็คชื่อไปแล้ว")
return false

}

return true

}

function onScanSuccess(decodedText){

// decodedText เช่น scan.html?room=1-0308
let url = new URL(decodedText, window.location.origin)

scannedRoom = url.searchParams.get("room")

// หยุดกล้อง
scanner.clear()

// แสดงห้อง
document.getElementById("roomDisplay").innerText = "Room : " + scannedRoom

// แสดงฟอร์ม
document.getElementById("formSection").style.display = "block"

}

function checkin(){

console.log("checkin clicked")

if(!scannedRoom){
alert("กรุณาสแกน QR ก่อน")
return
}

let studentID = document.getElementById("student_id").value
let name = document.getElementById("name").value

if(!studentID || !name){
alert("กรอกข้อมูลก่อน")
return
}

let data = {
student_id: studentID,
name: name,
room: scannedRoom
}

console.log(data)

fetch(GAS_API_URL,{
  method:"POST",
  mode:"no-cors",
  body:JSON.stringify(data)
})
.then(()=>{
  alert("Check-in success")
})

}

// เริ่ม scanner
scanner = new Html5QrcodeScanner("reader",{
  fps:10,
  qrbox:200,
  videoConstraints: {
    facingMode: "environment" // 🔥 บังคับกล้องหลัง
  }
})
scanner.render(onScanSuccess)

function startScanner(){
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

  if(isMobile){
    // 📱 มือถือ → ใช้กล้องหลัง
    const html5QrCode = new Html5Qrcode("reader")
    html5QrCode.start(
      { facingMode: "environment" }, // 👈 กล้องหลัง
      { fps: 10, qrbox: 200 },
      onScanSuccess
    )
    scanner = html5QrCode
  }else{
    // 💻 คอม → ใช้แบบเดิม
    scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:200})
    scanner.render(onScanSuccess)
  }
}

// เรียกใช้งาน
startScanner()

</script>

</body>
</html>
