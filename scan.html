<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Check-in System</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="api-config.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #3b82f6;
      --primary-dark: #1e40af;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --info-color: #0ea5e9;
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    body {
      font-family: 'Prompt', 'Poppins', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e40af 25%, #3b82f6 50%, #0ea5e9 75%, #06b6d4 100%);
      padding: 40px 24px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2);
      margin-bottom: 40px;
      border-radius: 0 0 28px 28px;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: 28px;
      color: #ffffff;
      margin-bottom: 4px;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .header-subtitle {
      color: #e0f2fe;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
    }

    .header-buttons {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: var(--shadow-md);
      padding: 40px;
    }

    h2 {
      text-align: center;
      color: var(--text-main);
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #reader {
      margin: 20px 0;
      border-radius: 8px;
      overflow: hidden;
    }

    .roomLabel {
      text-align: center;
      padding: 20px;
      font-size: 18px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .modal-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .modal-title {
      font-size: 24px;
      color: var(--text-main);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .modal-text {
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .modal-btn {
      padding: 12px 30px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .modal-btn:hover {
      background: var(--primary-dark);
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .back:hover {
      text-decoration: underline;
    }

    .status-message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .status-message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status-message.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <div class="header">
    <div class="header-container">
      <div>
        <h1>📱 Student Check-in</h1>
        <div class="header-subtitle">QR Code Scanner</div>
      </div>
      <div class="header-buttons">
      </div>
    </div>
  </div>

  <div class="container">
    <h2>📱 Student Check-in</h2>
    
    <div id="statusMessage" class="status-message"></div>

    <!-- Step 1: User Info Form -->
    <div id="formSection" style="display:block;">
      <div class="form-group">
        <label for="student_id">Student ID</label>
        <input id="student_id" placeholder="Enter your ID" type="text">
      </div>

      <div class="form-group">
        <label for="name">Name</label>
        <input id="name" placeholder="Enter your Name" type="text">
      </div>

      <div class="form-group">
        <label for="room">Room</label>
        <input id="room" placeholder="Enter your Room (e.g., 1-0308)" type="text">
      </div>

      <button onclick="startScanning()">Proceed to Scan</button>
    </div>

    <!-- Step 2: Scanner (Hidden initially) -->
    <div id="scanSection" style="display:none;">
      <div id="reader"></div>
      <div class="roomLabel" id="roomDisplay"></div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-icon" id="modalIcon">✅</div>
      <h3 class="modal-title" id="modalTitle">Success!</h3>
      <p class="modal-text" id="modalText">Check-in confirmed successfully.</p>
      <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
  </div>

  <script>
    const ROOM_LAT = 13.90142;
    const ROOM_LNG = 100.53235;
    const MAX_DISTANCE = 50;

    let scannedRoom = null;
    let scanner = null;
    let studentData = { id: null, name: null, room: null };
    let isProcessing = false;

    function showStatus(message, type = 'info') {
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.textContent = message;
      statusDiv.className = `status-message ${type}`;
      statusDiv.style.display = 'block';
      
      if (type === 'error') {
        setTimeout(() => {
          statusDiv.style.display = 'none';
        }, 5000);
      }
    }

    function startScanning() {
      const studentID = document.getElementById("student_id").value.trim();
      const studentName = document.getElementById("name").value.trim();
      const room = document.getElementById("room").value.trim();

      if (!studentID || !studentName || !room) {
        showStatus("Please fill in all fields", 'error');
        return;
      }

      studentData.id = studentID;
      studentData.name = studentName;
      studentData.room = room;

      document.getElementById("formSection").style.display = "none";
      document.getElementById("scanSection").style.display = "block";
      showStatus("Scanning QR Code... Please point your camera at the QR code", 'info');

      scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      scanner.render(onScanSuccess, onScanError);
    }

    function onScanError(error) {
      // Silently ignore scanning errors
      console.log("Scan error:", error);
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c * 1000;
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      if (navigator.geolocation) {
        document.getElementById("roomDisplay").innerHTML = "<span style='color:#f39c12;'>🔍 Checking location...</span>";

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            const distance = getDistance(ROOM_LAT, ROOM_LNG, userLat, userLng);

            if (distance <= MAX_DISTANCE) {
              processScan(decodedText);
            } else {
              document.getElementById("roomDisplay").innerHTML = "<br><br><span style='color:red; font-size: 18px; font-weight: bold;'>❌ Out of range. Cannot check in.</span>";
              isProcessing = false;
            }
          },
          (error) => {
            let errorMsg = "Cannot get location";
            if (error.code === error.PERMISSION_DENIED) {
              errorMsg = "Please allow location access";
            }
            document.getElementById("roomDisplay").innerHTML = `<br><br><span style='color:red; font-size: 18px; font-weight: bold;'>${errorMsg}</span>`;
            isProcessing = false;
          },
          { enableHighAccuracy: true }
        );
      } else {
        showStatus("Geolocation not supported", 'error');
        isProcessing = false;
      }
    }

    function formatTime(date) {
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}`;
    }

    function formatDate(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function processScan(decodedText) {
      const now = new Date();
      
      let data = { 
        date: formatDate(now),
        student_id: studentData.id, 
        name: studentData.name, 
        room: studentData.room,
        check_in: formatTime(now),
        check_out: '-',
        status: 'on-time',
        late_time: '-'
      };

      document.getElementById("roomDisplay").innerHTML = "<span style='color:#2ecc71;'>✅ Saving data...</span>";
      sendAttendanceData(data, 0);
    }

    function sendAttendanceData(data, retryCount = 0) {
      const maxRetries = 3;
      const apiUrl = typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : '';

      if (!apiUrl) {
        showStatus("API URL not configured", 'error');
        isProcessing = false;
        return;
      }

      fetch(apiUrl, {
        method: "POST",
        mode: "no-cors",
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data)
      }).then(response => {
        console.log('✅ Data sent successfully');
        document.getElementById("modalIcon").textContent = "✅";
        document.getElementById("modalTitle").textContent = "Success!";
        document.getElementById("modalText").textContent = "Check-in recorded at " + data.check_in;
        document.getElementById("successModal").style.display = "flex";
      }).catch((err) => {
        console.error('❌ Error:', err);
        
        if (retryCount < maxRetries) {
          console.log(`🔄 Retrying... (${retryCount + 1}/${maxRetries})`);
          document.getElementById("roomDisplay").innerHTML = `<span style='color:#f59e0b;'>Retrying... (${retryCount + 1}/${maxRetries})</span>`;
          
          setTimeout(() => {
            sendAttendanceData(data, retryCount + 1);
          }, 2000);
        } else {
          document.getElementById("modalIcon").textContent = "❌";
          document.getElementById("modalTitle").textContent = "Error";
          document.getElementById("modalText").textContent = "Failed to save data. Please check your connection.";
          document.getElementById("successModal").style.display = "flex";
          isProcessing = false;
        }
      });
    }

    function closeModal() {
      document.getElementById("successModal").style.display = "none";
      window.location.reload();
    }
  </script>
</body>

</html>
