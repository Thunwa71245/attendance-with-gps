<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Intern Check-in</title>

<script src="api-config.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  text-align:center;
  padding:20px;
}

.container{
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:400px;
  margin:auto;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.title{
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  font-size:14px;
  color:#666;
  margin-bottom:15px;
}

/* 💻 คอม */
#reader{
  width:100%;
  max-width:400px;
  margin:auto;
  border-radius:12px;
  overflow:hidden;
}

/* 📱 มือถือ */
@media (max-width:768px){
  #reader{
    width:100%;
    height:65vh; /* 🔥 ใหญ่เฉพาะมือถือ */
  }
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  padding:14px;
  width:100%;
  background:#2ecc71;
  color:white;
  border:none;
  border-radius:10px;
}

#reader__dashboard_section button{
  background: linear-gradient(135deg,#3498db,#2ecc71) !important;
  color:white !important;
  border-radius:12px !important;
  width:100% !important;
}

#formSection{
  display:none;
}

.roomLabel{
  font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="title">📷 สแกนเข้าห้อง</div>
<div class="subtitle">กรุณาสแกน QR Code เพื่อเช็คชื่อ</div>

<div id="reader"></div>

<input type="file" id="qrFile" accept="image/*" style="display:none;">

<div class="roomLabel" id="roomDisplay"></div>

<div id="formSection">
<input id="student_id" placeholder="Student ID">
<input id="name" placeholder="Name">
<button onclick="checkin()">Check-in</button>
</div>

</div>

<script>

function onScanSuccess(decodedText){

  let url = new URL(decodedText, window.location.origin)
  scannedRoom = url.searchParams.get("room")

  if(scanner){
    if(scanner.stop){
      scanner.stop().then(()=>scanner.clear())
    }else{
      scanner.clear()
      let url = new URL(decodedText, window.location.origin)
  let room = url.searchParams.get("room")

  // 🕒 เวลาปัจจุบัน
  let now = new Date()
  let time = now.toLocaleTimeString()

  // 🔥 ส่งไปหน้า result
  window.location.href = `result.html?room=${room}&time=${time}`
    }
  }

  document.getElementById("roomDisplay").innerText = "Room : " + scannedRoom
  document.getElementById("formSection").style.display = "block"
}

// 🔥 ตรวจอุปกรณ์
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

if(isMobile){

  // 📱 มือถือ
  Html5Qrcode.getCameras().then(devices => {

    let backCamera = devices[devices.length - 1]

    const qrSize = 300 // 🔥 ใหญ่เฉพาะมือถือ

    scanner = new Html5Qrcode("reader")

    scanner.start(
      backCamera.id,
      { fps:10, qrbox: qrSize },
      onScanSuccess
    )
  })

  document.getElementById("qrFile").style.display = "block"

}else{

  // 💻 คอม
  scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:200})
  scanner.render(onScanSuccess)

  document.getElementById("qrFile").style.display = "none"
}

// 🔥 scan file
document.getElementById("qrFile").addEventListener("change", function(e){

  const file = e.target.files[0]
  if(!file) return

  const tempScanner = new Html5Qrcode("reader")

  tempScanner.scanFile(file, true)
    .then(decodedText=>{
      onScanSuccess(decodedText)
    })
    .catch(()=>{
      alert("อ่าน QR ไม่สำเร็จ")
    })
})

function checkin(){

  if(!scannedRoom){
    alert("กรุณาสแกน QR ก่อน")
    return
  }

  let studentID = document.getElementById("student_id").value
  let name = document.getElementById("name").value

  if(!studentID || !name){
    alert("กรอกข้อมูลก่อน")
    return
  }

  fetch(GAS_API_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({
      student_id: studentID,
      name: name,
      room: scannedRoom
    })
  })
  .then(()=> alert("Check-in success"))
}

</script>

</body>
</html>
