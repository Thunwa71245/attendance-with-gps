<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Intern Check-in</title>

<script src="api-config.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  text-align:center;
  padding:20px;
}

.container{
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:400px;
  margin:auto;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.title{
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  font-size:14px;
  color:#666;
  margin-bottom:15px;
}

#reader{
  width:100%;
  max-width:400px;
  margin:auto;
  border-radius:12px;
  overflow:hidden;
}

@media (max-width:768px){
  #reader{
    height:65vh;
  }
}

button{
  padding:14px;
  width:100%;
  background:#2ecc71;
  color:white;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="title">📷 สแกนเข้าห้อง</div>
<div class="subtitle">กรุณาสแกน QR Code เพื่อเช็คชื่อ</div>

<div id="reader"></div>

<!-- 🔥 ปุ่มเลือกไฟล์ -->
<button onclick="document.getElementById('qrFile').click()">
  📂 Scan an Image File
</button>

<input type="file" id="qrFile" accept="image/*" style="display:none;">

</div>

<script>

let scanner

// 🔥 ฟังก์ชันหลัก (สำคัญที่สุด)
function onScanSuccess(decodedText){

  let room = ""

  try{
    let url = new URL(decodedText, window.location.origin)
    room = url.searchParams.get("room")
  }catch{
    room = decodedText
  }

  // 🔥 หยุดกล้อง
  if(scanner){
    if(scanner.stop){
      scanner.stop().then(()=>scanner.clear())
    }else{
      scanner.clear()
    }
  }

  let now = new Date()
  let time = now.toLocaleTimeString()

  // 🔥 แสดงล็อคอินสำเร็จ
  document.body.innerHTML = `
    <div style="
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#f4f6f9;
      font-family:Arial;
    ">
      <div style="
        background:white;
        padding:30px;
        border-radius:15px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.1);
      ">
        <div style="font-size:40px;">✅</div>
        <div style="font-size:22px; font-weight:bold; margin-top:10px;">
          ล็อคอินสำเร็จ
        </div>
      </div>
    </div>
  `

  // ⏳ หน่วงแล้วไปหน้า result
  setTimeout(()=>{
    window.location.href = `result.html?room=${room}&time=${time}`
  },1500)
}

// 🔥 ตรวจอุปกรณ์
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)

if(isMobile){

  // 📱 มือถือ
  Html5Qrcode.getCameras().then(devices => {

    let backCamera = devices[devices.length - 1]

    scanner = new Html5Qrcode("reader")

    scanner.start(
      backCamera.id,
      { fps:10, qrbox:300 },
      onScanSuccess
    )
  })

}else{

  // 💻 คอม
  scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:200})
  scanner.render(onScanSuccess)

}

// 🔥 scan จากไฟล์
document.getElementById("qrFile").addEventListener("change", function(e){

  const file = e.target.files[0]
  if(!file) return

  const tempScanner = new Html5Qrcode("reader")

  tempScanner.scanFile(file, false)
    .then(decodedText=>{
      onScanSuccess(decodedText)
    })
    .catch(()=>{
      alert("อ่าน QR ไม่สำเร็จ")
    })
})

</script>

</body>
</html>
