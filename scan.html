<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Intern Check-in</title>

<script src="api-config.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
  font-family:Arial;
  background:#f4f6f9;
  text-align:center;
  padding:20px;
}

.container{
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:400px;
  margin:auto;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* 🔥 หัวข้อ */
.title{
  font-size:30px;
  font-weight:bold;
  margin-bottom:5px;
}

.subtitle{
  font-size:14px;
  color:#666;
  margin-bottom:15px;
}

/* 🔥 กล้อง */
#reader{
  width:100%;
  border-radius:12px;
  overflow:hidden;
}

/* 🔥 input */
input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

/* 🔥 ปุ่ม check-in */
button{
  padding:14px;
  width:100%;
  background:#2ecc71;
  color:white;
  border:none;
  font-size:16px;
  border-radius:10px;
  cursor:pointer;
}

/* 🔥 ปรับปุ่ม Request Camera */
#reader__dashboard_section button{
  background: linear-gradient(135deg,#3498db,#2ecc71) !important;
  color:white !important;
  font-weight:bold !important;
  border:none !important;
  border-radius:12px !important;
  padding:14px !important;
  width:100% !important;
}

/* 📱 mobile ใหญ่ขึ้น */
@media (max-width:768px){
  .title{
    font-size:34px;
  }
}

#formSection{
  display:none;
}

.roomLabel{
  font-weight:bold;
  margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<div class="title">📷 สแกนเข้าห้อง</div>
<div class="subtitle">กรุณาสแกน QR Code เพื่อเช็คชื่อ</div>

<div id="reader"></div>

<div class="roomLabel" id="roomDisplay"></div>

<div id="formSection">

Student ID
<input id="student_id">

Name
<input id="name">

<button onclick="checkin()">Check-in</button>

</div>

</div>

<script>

let scannedRoom = null
let scanner = null

function onScanSuccess(decodedText){

  let url = new URL(decodedText, window.location.origin)
  scannedRoom = url.searchParams.get("room")

  if(scanner){
    scanner.clear()
  }

  document.getElementById("roomDisplay").innerText = "Room : " + scannedRoom
  document.getElementById("formSection").style.display = "block"
}

function checkin(){

  if(!scannedRoom){
    alert("กรุณาสแกน QR ก่อน")
    return
  }

  let studentID = document.getElementById("student_id").value
  let name = document.getElementById("name").value

  if(!studentID || !name){
    alert("กรอกข้อมูลก่อน")
    return
  }

  let data = {
    student_id: studentID,
    name: name,
    room: scannedRoom
  }

  fetch(GAS_API_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify(data)
  })
  .then(()=>{
    alert("Check-in success")
  })
}

// 🔥 ใช้ Scanner เดิม (มี Scan Image อยู่)
scanner = new Html5QrcodeScanner("reader",{fps:10,qrbox:250})
scanner.render(onScanSuccess)

</script>

</body>
</html>
