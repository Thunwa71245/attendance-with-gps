<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Config</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="config-page">
  <div class="container">
    <h2>System Config</h2>
    <label for="gas_url">Google Apps Script URL</label>
    <input id="gas_url" placeholder="https://script.google.com/macros/s/...">
    <label for="room">Default Room</label>
    <input id="room" value="1-0308">
    <label for="start_time">Start Time</label>
    <input id="start_time" type="time" value="08:00">
    <label for="close_time">Close Time</label>
    <input id="close_time" type="time" value="09:00">
    <button onclick="save()">Save</button>
    <div class="back-container">
      <a href="index.html" class="back">&larr; Back to Home</a>
    </div>
  </div>
  <script>
    function load() {
      document.getElementById("gas_url").value = localStorage.getItem("gas_url") || "";
      if (localStorage.getItem("default_room")) document.getElementById("room").value = localStorage.getItem("default_room");
      if (localStorage.getItem("start_time")) document.getElementById("start_time").value = localStorage.getItem("start_time");
      if (localStorage.getItem("close_time")) document.getElementById("close_time").value = localStorage.getItem("close_time");
    }
    function save() {
      localStorage.setItem("gas_url", document.getElementById("gas_url").value);
      localStorage.setItem("default_room", document.getElementById("room").value);
      localStorage.setItem("start_time", document.getElementById("start_time").value);
      localStorage.setItem("close_time", document.getElementById("close_time").value);
      alert("Saved Successfully");
    }
    load();
  </script>
</body>

</html>
